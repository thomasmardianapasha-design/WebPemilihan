<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Admin — Pemilihan Digital</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<header class="topbar">
<a class="brand" href="index.html">
<img class="brand-mark" src="assets/logo-nyoblos.svg" alt="">
Pemilihan Digital
</a>
<a class="text-link" href="index.html">Beranda</a>
</header>
<main class="auth-wrap">
<section class="auth-card">
<span class="eyebrow">PANEL ADMIN</span>
<h1>Masuk ke dashboard</h1>
<p class="muted">Gunakan akun admin yang dibuat melalui Firebase Authentication.</p>
<form id="admin-login-form" class="form-stack">
<label>Email admin</label>
<input id="admin-email" type="email" required placeholder="admin@email.com">
<label>Password</label>
<input id="admin-password" type="password" required placeholder="Password">
<button class="btn btn-primary full">Masuk</button>
<p class="form-note" id="admin-login-message"></p>
</form>
</section>
</main>
<script type="module" src="js/admin-auth.js"></script>
</body>
</html>
