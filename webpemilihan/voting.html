<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pilih Kandidat — Pemilihan Digital</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="auth-page">
    <header class="topbar">
      <a class="brand" href="index.html">
        <img class="brand-mark" src="assets/logo-nyoblos.svg" alt="">
        Pemilihan Digital
      </a>
      <a class="text-link" href="index.html">Kembali ke beranda</a>
    </header>

    <main class="auth-wrap">
      <section class="auth-card">
        <span class="eyebrow">AREA PEMILIH</span>
        <h1>Tentukan pilihanmu</h1>
        <p class="muted">
          Pelajari profil dan visi misi sebelum memilih satu pasangan kandidat.
        </p>

        <div class="candidate-select">
          <label class="select-card">
            <input type="radio" name="candidate" value="candidate-01">
            <div class="candidate-placeholder">01</div>
            <h3>Pasangan Kandidat 01</h3>
            <p>Profil dan visi misi kandidat</p>
          </label>

          <label class="select-card">
            <input type="radio" name="candidate" value="candidate-02">
            <div class="candidate-placeholder alt">02</div>
            <h3>Pasangan Kandidat 02</h3>
            <p>Profil dan visi misi kandidat</p>
          </label>
        </div>

        <button class="btn btn-primary full" id="continue-vote" type="button">
          Lanjut ke konfirmasi
        </button>
        <p class="form-note" id="vote-message"></p>
      </section>
    </main>

    <script type="module" src="js/voter-flow.js"></script>
  </body>
</html>
